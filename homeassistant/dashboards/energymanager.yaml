# The site's dashboard (spec: dashboard; examples E1, E2, E5). Refers to
# entities only, never to site-specific values.
title: Energymanager
views:
  - title: Overview
    path: overview
    cards:
      # S5, E23 to E26: when extra consumption needs no grid import. The bars are
      # the solar headroom: the energy that can be used in the hour starting at
      # that quarter hour, so kWh in one hour = kW on average. A first version:
      # the expected load comes from a daily load curve and the weather (README,
      # "Solar headroom").
      - type: vertical-stack
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Solar headroom, next 48 h (kW)
            graph_span: 48h
            span:
              start: hour
            yaxis:
              - min: 0
                decimals: 1
            apex_config:
              legend:
                show: true
            series:
              - entity: sensor.forecast_archive_solar_headroom
                name: Headroom (kWh in the hour from here)
                color: "#43a047"
                type: column
                show:
                  legend_value: false
                data_generator: |
                  return (entity.attributes.steps || []).map(
                    s => [new Date(s.start).getTime(), s.headroom_kwh]);
              - entity: sensor.forecast_archive_solar_headroom
                name: Solar forecast
                color: "#1e88e5"
                type: line
                stroke_width: 1.5
                show:
                  legend_value: false
                data_generator: |
                  return (entity.attributes.steps || []).map(
                    s => [new Date(s.start).getTime(), s.pv_kwh * 4]);
              - entity: sensor.forecast_archive_solar_headroom
                name: Expected household load
                color: "#757575"
                type: line
                stroke_width: 1.5
                show:
                  legend_value: false
                data_generator: |
                  return (entity.attributes.steps || []).map(
                    s => [new Date(s.start).getTime(), s.load_kwh * 4]);
          - type: markdown
            content: |-
              {% set s = 'sensor.forecast_archive_solar_headroom' %}
              {% if state_attr(s, 'missing') %}**Not available:** {{ state_attr(s, 'missing') }}
              {% else %}Headroom in the next hour: **{{ states(s) }} kWh**. Made {{ as_local(as_datetime(state_attr(s, 'made_at'))).strftime('%H:%M') if state_attr(s, 'made_at') else '?' }}; battery state of charge as of {{ as_local(as_datetime(state_attr(s, 'soc_recorded_at'))).strftime('%H:%M') if state_attr(s, 'soc_recorded_at') else '?' }}.{% endif %}

      - type: entities
        title: Now
        entities:
          - entity: sensor.sonoff_snzb_02dr2_temperatur
            name: Room (upper floor corridor)
          - entity: sensor.sonoff_snzb_02dr2_luftfeuchtigkeit
            name: Room humidity
          - entity: sensor.altherma_climatecontrol_aussentemperatur
            name: Outdoor (Daikin)
          - entity: sensor.altherma_climatecontrol_austrittswasser_temperatur
            name: Leaving water (floor, or tank while heating it)
          - entity: sensor.altherma_domestichotwatertank_tanktemperatur
            name: Hot-water tank
          - entity: sensor.rct_power_storage_all_generators_power
            name: Solar power
          - entity: sensor.battery_at_rct_power_storage_battery_state_of_charge
            name: Battery state of charge
          - entity: sensor.rct_power_storage_battery_power
            name: Battery power (negative = charging)
          - entity: sensor.energymanager_battery_state_machine
            name: Battery state machine (raw, from the collector)
            secondary_info: last-updated
          - entity: sensor.energymanager_battery_status_raw
            name: Battery status (raw, from the collector)
            secondary_info: last-updated
          - entity: sensor.energymanager_collector_state_read
            name: Collector last read the inverter
          - entity: sensor.rct_power_storage_consumer_power
            name: Household load
          - entity: sensor.rct_power_storage_grid_power
            name: Grid power
          - entity: sensor.altherma_climatecontrol_taglicher_stromverbrauch_heizung
            name: Heat pump today, heating
          - entity: sensor.altherma_domestichotwatertank_taglicher_stromverbrauch_heizung
            name: Heat pump today, hot water
          - entity: sensor.rct_power_storage_grid_energy_consumption_day
            name: Grid import today
          - entity: sensor.rct_power_storage_grid_energy_production_day
            name: Grid export today (negative)

      - type: history-graph
        title: Temperatures, 48 h
        hours_to_show: 48
        entities:
          - entity: sensor.sonoff_snzb_02dr2_temperatur
            name: Room (upper floor corridor)
          - entity: sensor.altherma_climatecontrol_aussentemperatur
            name: Outdoor
          - entity: sensor.altherma_climatecontrol_austrittswasser_temperatur
            name: Leaving water (floor or tank)
          - entity: sensor.altherma_domestichotwatertank_tanktemperatur
            name: Hot-water tank

      - type: history-graph
        title: Electricity, 48 h
        hours_to_show: 48
        entities:
          - entity: sensor.rct_power_storage_all_generators_power
            name: Solar
          - entity: sensor.rct_power_storage_consumer_power
            name: Household load
          - entity: sensor.rct_power_storage_grid_power
            name: Grid
          - entity: sensor.rct_power_storage_battery_power
            name: Battery

      - type: history-graph
        title: Battery state of charge, 48 h
        hours_to_show: 48
        entities:
          - entity: sensor.battery_at_rct_power_storage_battery_state_of_charge
            name: State of charge

      - type: entities
        title: Solar forecast (forecast.solar)
        entities:
          - entity: sensor.power_production_now
            name: Power now
          - entity: sensor.energy_current_hour
            name: This hour
          - entity: sensor.energy_next_hour
            name: Next hour
          - entity: sensor.energy_production_today_remaining
            name: Rest of today
          - entity: sensor.energy_production_tomorrow
            name: Tomorrow

      - type: weather-forecast
        entity: weather.home_2
        name: Weather (Open-Meteo)
        forecast_type: hourly

      # E5: measured production against the solar forecast and the weather-based
      # upper estimate (irradiance on the roof plane x kWp, design D6), per hour.
      - type: custom:apexcharts-card
        header:
          show: true
          title: Solar energy per hour (Wh)
        graph_span: 48h
        span:
          end: hour
        yaxis:
          - min: 0
            decimals: 0
        apex_config:
          legend:
            show: true
        series:
          - entity: sensor.rct_power_storage_all_generators_power
            name: Measured
            unit: Wh
            color: "#212121"
            type: line
            curve: stepline
            stroke_width: 2
            show:
              legend_value: false
            statistics:
              type: mean
              period: hour
              align: start
          - entity: sensor.forecast_archive_e5
            name: Solar forecast (forecast.solar)
            unit: Wh
            color: "#1e88e5"
            type: line
            curve: stepline
            stroke_width: 1.5
            show:
              legend_value: false
            data_generator: |
              return entity.attributes.hours.map(
                h => [new Date(h.start).getTime(), h.solar_forecast_wh]);
          - entity: sensor.forecast_archive_e5
            name: Weather-based upper estimate (Open-Meteo)
            unit: Wh
            color: "#e53935"
            type: line
            curve: stepline
            stroke_width: 1.5
            show:
              legend_value: false
            data_generator: |
              return entity.attributes.hours.map(
                h => [new Date(h.start).getTime(), h.weather_estimate_wh]);

  # A first try at comparing control strategies (examples E20 to E22), to be
  # tested on the data. Net cost = grid import x grid price - feed-in x feed-in
  # tariff; prices in the archive's settings (.env.example). One card over the
  # full width (panel), the plots stacked in it.
  - title: Control strategies
    path: control-strategies
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: custom:plotly-graph
            title: Net electricity cost per week over outdoor temperature
            raw_plotly_config: true
            layout:
              height: 480
              margin: {l: 60, r: 20, t: 10, b: 50}
              legend: {orientation: h, x: 0, y: 1.08}
              showlegend: true
              xaxis:
                type: linear
                title:
                  text: Mean outdoor temperature of the week (°C)
              yaxis:
                title:
                  text: Net cost per week (€)
            entities:
              - entity: ""
                name: Baseline (actual)
                type: scatter
                mode: markers
                customdata: >-
                  $ex (hass.states["sensor.forecast_archive_control_strategies"]?.attributes.weeks ?? [])
                  .filter(w => w.strategy === "baseline" && w.result === "actual")
                x: $ex getFromConfig("entities.0.customdata").map(w => w.temperature_c)
                y: $ex getFromConfig("entities.0.customdata").map(w => w.cost_eur)
                hovertemplate: |-
                  <b>%{customdata.week}</b> (from %{customdata.start})<br>
                  Cost: %{y:.2f} €, mean temperature %{x:.1f} °C<br>
                  Solar spill: %{customdata.spill_eur:.2f} € (%{customdata.spill_kwh} kWh)<br>
                  Load %{customdata.load_kwh} kWh, import %{customdata.import_kwh} kWh, feed-in %{customdata.feed_kwh} kWh
                  <extra></extra>

          # E22: each week against what the baseline would have cost under that week's
          # weather (the adjusted baseline, design/research/weather-normalisation.md).
          - type: custom:plotly-graph
            title: Net cost per week against the baseline's expected cost
            raw_plotly_config: true
            layout:
              height: 480
              margin: {l: 60, r: 20, t: 10, b: 50}
              legend: {orientation: h, x: 0, y: 1.08}
              showlegend: true
              xaxis:
                title:
                  text: Expected cost of the baseline under the week's weather (€)
              yaxis:
                title:
                  text: Actual cost per week (€)
            entities:
              - entity: ""
                name: Baseline (actual)
                type: scatter
                mode: markers
                customdata: >-
                  $ex (hass.states["sensor.forecast_archive_control_strategies"]?.attributes.weeks ?? [])
                  .filter(w => w.strategy === "baseline" && w.result === "actual")
                x: $ex getFromConfig("entities.0.customdata").map(w => w.expected_cost_eur)
                y: $ex getFromConfig("entities.0.customdata").map(w => w.cost_eur)
                hovertemplate: |-
                  <b>%{customdata.week}</b> (from %{customdata.start})<br>
                  Actual %{y:.2f} €, expected %{x:.2f} €, saving %{customdata.saving_eur:.2f} €<br>
                  Degree days %{customdata.hdd}, PV %{customdata.pv_kwh} kWh, %{customdata.temperature_c:.1f} °C
                  <extra></extra>
              - entity: ""
                name: Same cost as expected
                mode: lines
                line: {dash: dot, color: grey}
                hoverinfo: skip
                # From the smallest to the largest cost shown, actual or expected.
                x: >-
                  $ex (c => c.length ? [Math.min(...c), Math.max(...c)] : [])(getFromConfig("entities.0.customdata")
                  .flatMap(w => [w.cost_eur, w.expected_cost_eur]))
                y: $ex getFromConfig("entities.1.x")

          - type: custom:plotly-graph
            title: Saving per week against the baseline (€)
            raw_plotly_config: true
            layout:
              height: 320
              margin: {l: 60, r: 20, t: 10, b: 40}
              xaxis:
                type: date
              yaxis:
                title:
                  text: Saving per week (€)
            entities:
              - entity: ""
                name: Baseline (actual)
                type: bar
                customdata: >-
                  $ex (hass.states["sensor.forecast_archive_control_strategies"]?.attributes.weeks ?? [])
                  .filter(w => w.strategy === "baseline" && w.result === "actual")
                x: $ex getFromConfig("entities.0.customdata").map(w => w.start)
                y: $ex getFromConfig("entities.0.customdata").map(w => w.saving_eur)
                # ± two out-of-sample errors of the week's period (inside or outside the
                # house's heating season): roughly where
                # the true saving lies around the value shown, about 95 % if the errors were
                # normal and independent (they are correlated from week to week; see the
                # model's lag-1 autocorrelation).
                error_y:
                  type: data
                  array: $ex getFromConfig("entities.0.customdata").map(w => w.band_eur ?? 0)
                  thickness: 1
                hovertemplate: |-
                  <b>%{customdata.week}</b>: saving %{y:.2f} € ± %{customdata.band_eur} €<br>
                  Actual %{customdata.cost_eur:.2f} €, expected %{customdata.expected_cost_eur:.2f} €
                  <extra></extra>

          # E21: consumption a better shift into sunny hours could in principle have
          # saved: per day the smaller of grid import and feed-in, at the price difference.
          - type: custom:plotly-graph
            title: Solar spill per week (€)
            raw_plotly_config: true
            layout:
              height: 320
              margin: {l: 60, r: 20, t: 10, b: 40}
              xaxis:
                type: date
              yaxis:
                title:
                  text: Spill per week (€)
            entities:
              - entity: ""
                name: Baseline (actual)
                type: bar
                customdata: >-
                  $ex (hass.states["sensor.forecast_archive_control_strategies"]?.attributes.weeks ?? [])
                  .filter(w => w.strategy === "baseline" && w.result === "actual")
                x: $ex getFromConfig("entities.0.customdata").map(w => w.start)
                y: $ex getFromConfig("entities.0.customdata").map(w => w.spill_eur)
                hovertemplate: |-
                  <b>%{customdata.week}</b>: %{y:.2f} € (%{customdata.spill_kwh} kWh)<extra></extra>

          - type: markdown
            content: |-
              {% set s = 'sensor.forecast_archive_control_strategies' %}
              {% set m = state_attr(s, 'model') %}
              {% set p = state_attr(s, 'prices') %}
              **How to read this (a first try).** Net cost = grid import ×
              {{ p.grid_eur_per_kwh if p else '?' }} €/kWh − feed-in ×
              {{ p.feed_in_eur_per_kwh if p else '?' }} €/kWh. The expected cost is what the
              baseline would have cost under the week's weather: grid import and feed-in are
              fitted on the baseline weeks against heating degree days, PV yield and their
              product, then
              priced. The saving is expected − actual. Each week's whiskers mark ± two
              out-of-sample errors of its group: inside or outside the heating season.
              Details: README, "Comparing control strategies".
              {% if m %}
              Model: {{ m.baseline_weeks }} baseline weeks, degree days below
              {{ m.base_temperature_c }} °C (fitted), lag-1 autocorrelation of the errors
              {{ m.lag1_autocorrelation if m.lag1_autocorrelation is not none else 'not available' }}.
              R² {{ m.r2_cost }}, which the easy weeks without heating make look better than
              the heating season is; the error per week inside and outside the heating season
              (weeks in which the heat pump heated; where unknown, weeks colder than
              {{ m.base_temperature_c }} °C) is the honest figure:

              | Weeks | Number | Error in sample | Error out of sample (each quarter of a year left out of the fit in turn) |
              |---|---|---|---|
              {% for name, s in (m.periods or {}).items() -%}
              | {{ 'Heating season' if name == 'heating' else 'Outside the heating season' }} | {{ s.weeks }} | {{ s.rms_eur ~ ' €' if s.rms_eur is not none else '–' }} | {{ s.rms_out_of_sample_eur ~ ' €' if s.rms_out_of_sample_eur is not none else '–' }} |
              {% endfor %}
              {% endif %}

              Temperature: [Weather data by Open-Meteo.com](https://open-meteo.com/)
              ([CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)), daily means of the
              hourly values. Energy: the inverter's daily logs.
