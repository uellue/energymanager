name: energymanager

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.2
    restart: unless-stopped
    # Host networking: reaches the inverter on the home network and the archive
    # on 127.0.0.1 (design D1). The web interface is on port 8123.
    network_mode: host
    environment:
      TZ: Europe/Berlin
    volumes:
      - ${EM_DATA_DIR:?set in .env}/homeassistant:/config
      # Versioned parts of the configuration (design D3).
      - ./homeassistant/packages:/config/packages:ro
      - ./homeassistant/dashboards:/config/dashboards:ro
      # Server certificate from tools/local_tls.sh, if the site uses HTTPS
      # (README, "HTTPS on the home network").
      - ${EM_DATA_DIR:?set in .env}/tls/server:/ssl:ro

  archive:
    build: ./archive
    restart: unless-stopped
    # Host networking: the endpoint binds to 127.0.0.1 of this machine, where
    # Home Assistant reaches it and the home network does not (design D8).
    network_mode: host
    environment:
      EM_LATITUDE: ${EM_LATITUDE:?set in .env}
      EM_LONGITUDE: ${EM_LONGITUDE:?set in .env}
      EM_DECLINATION: ${EM_DECLINATION:?set in .env}
      EM_AZIMUTH: ${EM_AZIMUTH:?set in .env}
      EM_KWP: ${EM_KWP:?set in .env}
      EM_ARCHIVE_PORT: ${EM_ARCHIVE_PORT:-8765}
      EM_ARCHIVE_DB: /data/forecasts.sqlite
    volumes:
      - ${EM_DATA_DIR:?set in .env}/forecasts:/data

  collector:
    build: ./collector
    restart: unless-stopped
    # Host networking: reaches the inverter on the home network; the endpoint
    # binds to 127.0.0.1, where Home Assistant reads it (design C8).
    network_mode: host
    environment:
      EM_RCT_HOST: ${EM_RCT_HOST:?set in .env}
      EM_RCT_PORT: ${EM_RCT_PORT:-8899}
      EM_COLLECTOR_PORT: ${EM_COLLECTOR_PORT:-8766}
      EM_COLLECTOR_DB: /data/collector.sqlite
      TZ: Europe/Berlin
      # Home Assistant's API, for the Daikin diagnostics and to pause log reads
      # while the integration's values stop (design C5, C7).
      EM_HA_URL: ${EM_HA_URL:-http://localhost:8123}
      EM_HA_CAFILE: ${EM_HA_CAFILE:-}
      HA_TOKEN: ${HA_TOKEN:?set in .env}
    volumes:
      - ${EM_DATA_DIR:?set in .env}/collector:/data
      # The home certificate authority, if the site uses HTTPS (README).
      - ${EM_DATA_DIR:?set in .env}/tls/ca:/tls:ro
